<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form Exercise</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
        .page-top { text-align: center; margin-bottom: 30px; }
        .big-heading { font-size: 32px; margin-bottom: 10px; }
        .form-box { background: #f5f5f5; padding: 30px; border-radius: 8px; }
        .form-group { margin-bottom: 20px; }
        .label-text { display: block; margin-bottom: 5px; font-weight: bold; }
        .input-field { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .text-box { min-height: 100px; resize: vertical; }
        .submit-btn { background: #007bff; color: white; padding: 12px 30px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .submit-btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <header class="page-top">
        <h1 class="big-heading">Contact Us</h1>
        <p>We'd love to hear from you. Fill out the form below to get in touch.</p>
    </header>

    <main>
        <form class="form-box">
            <fieldset>
                <div class="form-group">
                    <label class="label-text" for="name">Name</label>
                    <input type="text" id="name" name="name" class="input-field" placeholder="Your name" required>
                </div>

                <div class="form-group">
                    <label class="label-text" for="email">Email</label>
                    <input type="email" id="email" name="email" class="input-field" placeholder="your@email.com" required>
                </div>

                <div class="form-group">
                    <label class="label-text" for="message">Message</label>
                    <textarea id="message" name="message" class="input-field text-box" placeholder="Your message here..." required></textarea>
                </div>

                <div>
                    <button type="submit" class="submit-btn">Send Message</button>
                </div>
            </fieldset>
        </form>
    </main>
</body>
</html>
