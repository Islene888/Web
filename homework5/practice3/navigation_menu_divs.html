<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation Exercise</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; }
        .top-section { background: #2c3e50; color: white; padding: 15px 0; }
        .container { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
        .site-name { font-size: 24px; font-weight: bold; margin-bottom: 10px; }
        .menu ul { display: flex; gap: 20px; list-style: none; margin: 0; padding: 0; }
        .menu-item { color: white; text-decoration: none; padding: 5px 10px; display: block; }
        .menu-item:hover { background: #34495e; }
        .page-content { padding: 40px 20px; max-width: 800px; margin: 0 auto; }
        .page-title { font-size: 36px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <header class="top-section">
        <div class="container">
            <h1 class="site-name">Tech Company</h1>
            <nav class="menu">
                <ul>
                    <li><a href="#home" class="menu-item">Home</a></li>
                    <li><a href="#about" class="menu-item">About</a></li>
                    <li><a href="#services" class="menu-item">Services</a></li>
                    <li><a href="#contact" class="menu-item">Contact</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main class="page-content">
        <h2 class="page-title">Welcome to Our Company</h2>
        <p>
            We provide innovative technology solutions for businesses of all sizes. Our team of experts is dedicated to helping you achieve your digital transformation goals.
        </p>
    </main>
</body>
</html>
