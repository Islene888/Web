<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📝 My Task List</h1>
        </header>

        <main>
            <!-- Add Task Form -->
            <section class="add-task-section">
                <div class="task-form">
                    <input type="text" id="taskTitle" placeholder="Enter task title..." maxlength="100" required>
                    <textarea id="taskDescription" placeholder="Task description (optional)..." rows="3" maxlength="500"></textarea>
                    <button id="addTaskBtn" type="button">Add Task</button>
                </div>
            </section>

            <!-- Task Statistics -->
            <section class="stats-section">
                <div class="stats">
                    <span class="stat-item">
                        <span class="stat-number" id="totalTasks">0</span>
                        <span class="stat-label">Total</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-number" id="completedTasks">0</span>
                        <span class="stat-label">Completed</span>
                    </span>
                    <span class="stat-item">
                        <span class="stat-number" id="pendingTasks">0</span>
                        <span class="stat-label">Pending</span>
                    </span>
                </div>
            </section>

            <!-- Task List -->
            <section class="tasks-section">
                <div class="tasks-header">
                    <h2>Task List</h2>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">All</button>
                        <button class="filter-btn" data-filter="pending">Pending</button>
                        <button class="filter-btn" data-filter="completed">Completed</button>
                    </div>
                </div>

                <div id="tasksList" class="tasks-list">
                    <!-- Task items will be dynamically generated by JavaScript -->
                </div>

                <!-- Empty State -->
                <div id="emptyState" class="empty-state" style="display: none;">
                    <div class="empty-icon">📝</div>
                    <h3>No tasks yet</h3>
                    <p>Add your first task to start managing your to-do items!</p>
                </div>
            </section>
        </main>

        <!-- Edit Task Modal -->
        <div id="editModal" class="modal" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">
                    <h3>Edit Task</h3>
                    <button class="close-btn" id="closeModal">&times;</button>
                </div>
                <div class="modal-body">
                    <input type="text" id="editTaskTitle" placeholder="Task title..." maxlength="100" required>
                    <textarea id="editTaskDescription" placeholder="Task description (optional)..." rows="3" maxlength="500"></textarea>
                </div>
                <div class="modal-footer">
                    <button id="cancelEdit" class="btn-secondary">Cancel</button>
                    <button id="saveEdit" class="btn-primary">Save</button>
                </div>
            </div>
        </div>

        <!-- Loading Indicator -->
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
        </div>

        <!-- Message Container -->
        <div id="messageContainer" class="message-container"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
